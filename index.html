<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Penjaga login: kalau belum login, arahkan ke login.html -->
    <script>
        if (!(sessionStorage.getItem('pro05_session') || localStorage.getItem('pro05_session'))) {
            location.replace('login.html');
        }
    </script>
    <title>StokRumah (PRO-05) - Aplikasi Stok & Belanja Kebutuhan Rumah Tangga</title>

    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

            <!-- Logo & Brand -->
            <div class="d-flex align-items-center gap-3">
                <button id="mobileMenuBtn" class="d-md-none text-secondary app-hover-text-dark app-focus-no-outline">
                    <i class="fa-solid fa-bars fs-4"></i>
                </button>

                    <div class="bg-primary text-white p-2 rounded-3 d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-house-laptop fs-5"></i>
                    </div>
                    <div>
                        <span class="fw-bold fs-4 text-dark app-tracking-tight">Stok<span class="text-primary">Rumah</span></span>

                    </div>
                </div>
            </div>

            <!-- Global Search -->
            <div class="flex-fill app-max-width-md d-none app-sm-block">
                <div class="position-relative">
                    <span class="position-absolute app-inset-y-0 app-left-0 ps-3 d-flex align-items-center pe-none app-text-muted">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="globalSearch" placeholder="Cari nama barang, kategori, lokasi..." 
                           class="w-100 app-ps-10 pe-3 py-2 app-bg-gray text-body small rounded-3 app-focus-no-outline app-focus-ring app-focus-primary app-focus-white app-transition">
                </div>
            </div>

                         alt="Avatar" class="app-width-2rem-plus app-height-2rem-plus rounded-pill object-fit-cover app-ring app-ring-primary"
                         onerror="this.src='https : //placehold.co/100x100/6366f1/ffffff?text=U'">
                    <div class="d-none app-lg-block text-start">
                        <div class="small fw-semibold text-body" id="navUserName">Pengguna Rumah/Kos</div>
                        <div class="app-text-xs text-secondary">Aktor Utama</div>
                    </div>
                    <button type="button" onclick="logout()" title="Keluar" aria-label="Keluar" class="btn btn-sm btn-outline-secondary rounded-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i><span class="d-none d-md-inline">Keluar</span></button>
                </div>
            </div>
        </div>
    </header>

    <div class="d-flex flex-fill position-relative">

                <nav class="app-space-y-1">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn d-flex w-100 align-items-center gap-3 px-3 py-2 w-100 d-flex align-items-center gap-3 px-3 app-py-2-5 small fw-medium rounded-3 text-secondary app-hover-light app-transition">

                    <div class="pt-2 pb-1 px-3 app-text-11 fw-bold app-text-muted text-uppercase app-tracking-wide">DATA MASTER</div>

                    <button onclick="switchTab('barang')" id="nav-barang" class="nav-btn d-flex w-100 align-items-center gap-3 px-3 py-2 w-100 d-flex align-items-center gap-3 px-3 py-2 small fw-medium rounded-3 text-secondary app-hover-light app-transition">

                    </button>
                    <button onclick="switchTab('belanja')" id="nav-belanja" class="nav-btn d-flex w-100 align-items-center gap-3 px-3 py-2 w-100 d-flex align-items-center justify-content-between px-3 py-2 small fw-medium rounded-3 text-secondary app-hover-light app-transition">
                        <div class="d-flex align-items-center gap-3">
                            <i class="fa-solid fa-cart-shopping app-width-1-25rem text-center text-primary"></i> Daftar Belanja
                        </div>
                        <span id="badgeBelanja" class="bg-danger text-white app-text-xs px-2 app-py-0-5 rounded-pill fw-bold d-none">0</span>
                    </button>

                    <div class="pt-2 pb-1 px-3 app-text-11 fw-bold app-text-muted text-uppercase app-tracking-wide">PELAPORAN</div>

                    <i class="fa-solid fa-database"></i> Status Penyimpanan
                </div>
                <p class="text-primary">Tersimpan di Lokal Storage Web (Relasional FK Validated).</p>

            <!-- HALAMAN 1: DASHBOARD -->
            <section id="page-dashboard" class="page-content app-space-y-6">

                    </div>
                    <div class="d-flex align-items-center gap-2">

                        </button>

                            <i class="fa-solid fa-minus"></i> Stok Keluar
                        </button>
                    </div>
                </div>
