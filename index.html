<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Stok Rumah Tangga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <div class="brand-icon">⌂</div>
      <h1>Stok Rumah Tangga</h1>
      <p>Kelola kebutuhan harian dengan lebih mudah dan teratur.</p>
      <span class="copyright">© 2026 Stok Rumah Tangga</span>
    </section>
    <section class="login-form-panel">
      <form class="login-form" action="dashboard.html">
        <span class="eyebrow">SELAMAT DATANG</span>
        <h2>Login</h2>
        <p class="muted">Masuk untuk melanjutkan ke aplikasi.</p>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Masukkan username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" required>
        <button class="btn btn-dark btn-wide" type="submit">Login</button>
        <p class="login-note">Demo tampilan: isi username dan password, lalu tekan Login.</p>
      </form>
    </section>
  </main>
</body>
</html>
